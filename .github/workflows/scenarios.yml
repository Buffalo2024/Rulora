name: Scenario checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scenario:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [collective-decision]
        node: [22, 24]
    defaults:
      run:
        working-directory: examples/${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: examples/${{ matrix.scenario }}/package-lock.json
      - run: npm ci
      - name: Install this checkout of Core for collective integration
        if: matrix.scenario == 'collective-decision'
        run: npm install --no-save --package-lock=false ../..
      - run: npm test
      - run: npm run privacy:check && npm run example && npm run example:static && npm run example:controlled
      - if: matrix.scenario == 'collective-decision'
        run: npm run web:smoke && npm run example:langgraph
      - run: npm run pack:check
