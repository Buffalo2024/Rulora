<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030914"/>
      <stop offset="1" stop-color="#0b1322"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13d8f5"/>
      <stop offset="1" stop-color="#00aeca"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc14a"/>
      <stop offset="1" stop-color="#f39a16"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="11" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <image href="rulora-logo-512.png" x="104" y="104" width="432" height="432"/>
  <text x="596" y="237" fill="#ffffff" font-size="104" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="1">Rulora</text>
  <text x="600" y="307" fill="#b5c0cf" font-size="28" font-family="Inter, Arial, sans-serif">Execution contracts for reliable AI agents</text>
  <line x1="600" y1="354" x2="1160" y2="354" stroke="#26374b" stroke-width="2"/>
  <text x="600" y="414" fill="#16cde8" font-size="27" font-family="Inter, Arial, sans-serif" font-weight="600">Models understand and create.</text>
  <text x="600" y="462" fill="#ffb52f" font-size="27" font-family="Inter, Arial, sans-serif" font-weight="600">Programs control, validate and deliver.</text>
</svg>
